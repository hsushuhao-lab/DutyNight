name: One-time branch cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-branches-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete redundant remote branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin |
            awk '{sub("refs/heads/","",$2); print $2}'
          )
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|master) continue ;;
            esac
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches-once.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:master
