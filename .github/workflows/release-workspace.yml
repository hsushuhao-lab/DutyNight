name: Release candidate diagnostics
on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-workspace.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap,subprocess
          source=Path('.github/workflows/repair-workspace-export.yml').read_text()
          command=source.split('      - name: Apply guarded targeted repairs\n',1)[1].split('        run: |\n',1)[1].split('      - name: Build and verify candidate geometry\n',1)[0]
          subprocess.run(['bash','-e','-c',textwrap.dedent(command)],check=True)
          p=Path('prototype/scripts/test-b2-fail-forward.mjs');s=p.read_text()
          s=s.replace("  page.on('pageerror', error => report.errors.push(error.message));", "  page.on('pageerror', error => report.errors.push(error.message));\n  page.on('console',m=>{if(m.text().startsWith('FINAL_DIAG'))console.log(m.text());});")
          s=s.replace("    q.interact({type:'workstation'});", """    const original=q.controller.onInteract;
              q.controller.onInteract=async target=>{
                console.log('FINAL_DIAG before '+JSON.stringify({target,zone:q.worldRouter.activeZoneId,flags:Object.fromEntries(q.gameState.flags)}));
                await original(target);
                console.log('FINAL_DIAG after '+JSON.stringify({active:q.cinematicDirector.activeId,dialogue:!!q.uiManager.dialogueSequence,modal:document.getElementById('final-handoff-modal').className,flags:Object.fromEntries(q.gameState.flags)}));
              };
              q.interact({type:'workstation'});""")
          s=s.replace("  report.errors.push(error.stack || error.message);", "  report.errors.push(error.stack || error.message);\n  report.failureState=await page.evaluate(()=>({snapshot:window.__storyQA.snapshot(),subtitle:document.getElementById('subtitle-text').textContent,active:window.__storyQA.cinematicDirector.activeId,modals:[...document.querySelectorAll('.active')].map(e=>e.id)}));")
          p.write_text(s)
          PY
      - name: Build candidate
        working-directory: prototype
        run: |
          npm ci
          node scripts/write-build-info.mjs
          npm run build
          npx playwright install --with-deps chromium
      - name: B2 readiness reproduction
        working-directory: prototype
        timeout-minutes: 8
        run: node scripts/test-b2-fail-forward.mjs qa-results/release-b2-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-diagnostics
          path: prototype/qa-results/
          retention-days: 2
