name: Release workspace snapshot
on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce the guarded repair candidate without publishing
        id: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/repair-workspace-export.yml').read_text()
          command=source.split('      - name: Apply guarded targeted repairs\n',1)[1].split('        run: |\n',1)[1].split('      - name: Build and verify candidate geometry\n',1)[0]
          Path('/tmp/prepare-candidate.sh').write_text(textwrap.dedent(command))
          PY
          bash /tmp/prepare-candidate.sh
      - name: Export tracked source and locked dependencies only
        run: |
          mkdir -p /tmp/release-workspace
          git archive --format=tar.gz HEAD > /tmp/release-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/release-workspace/source-sha.txt
          git rev-parse HEAD^{tree} > /tmp/release-workspace/source-tree.txt
          cd prototype
          npm ci
          tar -czf /tmp/release-workspace/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: release-workspace
          path: /tmp/release-workspace/
          retention-days: 1
