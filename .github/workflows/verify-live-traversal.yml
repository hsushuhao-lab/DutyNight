name: Verify Published Traversal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
        working-directory: prototype
      - run: npx playwright install --with-deps chrome
        working-directory: prototype
      - name: Walk the published campus
        run: node scripts/test-playable-walkthrough.mjs ../docs/traversal-qa/live https://hsushuhao-lab.github.io/DutyNight/
        working-directory: prototype
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-traversal
          path: docs/traversal-qa/live/
