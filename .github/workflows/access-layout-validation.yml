name: Full Release QA
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: full-release
  cancel-in-progress: false
jobs:
  full-release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Record exact source
        run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Install locked dependencies
        working-directory: prototype
        run: npm ci
      - name: Full Node regressions
        working-directory: prototype
        run: node scripts/run-floorplan-regressions.mjs
      - name: Production build
        working-directory: prototype
        run: |
          node scripts/write-build-info.mjs
          npm run build
      - name: Browser dependencies
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Production browser walkthrough
        timeout-minutes: 38
        working-directory: prototype
        run: node scripts/test-floorplan-browser.mjs qa-results/full-release
      - name: Visual QA capture
        timeout-minutes: 13
        working-directory: prototype
        run: node scripts/capture-floorplan.mjs qa-results/screens
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public build fingerprint
        working-directory: prototype
        run: node scripts/verify-live-build.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Public deployed browser QA
        timeout-minutes: 38
        working-directory: prototype
        run: node scripts/test-floorplan-browser.mjs qa-results/live '${{ steps.deployment.outputs.page_url }}'
      - name: Preserve full release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-release-evidence
          path: |
            SOURCE_COMMIT.txt
            prototype/qa-results/
          retention-days: 30
