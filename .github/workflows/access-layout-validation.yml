name: Access layout validation
on:
  push:
    branches: [fix/access-layout-20260921]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: access-layout-validation
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/access-layout-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Materialize reviewed exact-hash edits once
        run: |
          if test -f tools/apply-access-edits.py; then
            python tools/apply-access-edits.py
            git add prototype tools
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(access): apply screenshot-approved hospital access and circulation corrections'
            git push origin HEAD:fix/access-layout-20260921
          fi
          echo "DUTYNIGHT_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install locked dependencies
        working-directory: prototype
        run: npm ci
      - name: All Node regressions
        working-directory: prototype
        run: node scripts/run-floorplan-regressions.mjs
      - name: Production build
        id: build
        working-directory: prototype
        run: |
          node scripts/write-build-info.mjs
          npm run build
      - name: Browser dependencies
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Continuous browser walkthrough
        working-directory: prototype
        run: node scripts/test-floorplan-browser.mjs
      - name: Fixed review viewpoints
        if: always() && steps.build.outcome == 'success'
        working-directory: prototype
        run: node scripts/capture-floorplan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-layout-evidence
          path: |
            SOURCE_COMMIT.txt
            prototype/qa-results/
          retention-days: 30
