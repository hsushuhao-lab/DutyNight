name: Access layout validation
on:
  push:
    branches: [fix/access-layout-20260921]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: access-layout-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Record exact source
        run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Install locked dependencies
        working-directory: prototype
        run: npm ci
      - name: All Node regressions
        working-directory: prototype
        run: node scripts/run-floorplan-regressions.mjs
      - name: Production build
        working-directory: prototype
        run: |
          node scripts/write-build-info.mjs
          npm run build
      - name: Browser dependencies
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Continuous browser walkthrough
        timeout-minutes: 38
        working-directory: prototype
        run: node scripts/test-floorplan-browser.mjs
      - name: Save the exact browser-tested site
        uses: actions/upload-artifact@v4
        with:
          name: access-layout-tested-site
          path: prototype/dist/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-layout-evidence
          path: |
            SOURCE_COMMIT.txt
            prototype/qa-results/
          retention-days: 30
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install, fingerprint and build the same commit
        working-directory: prototype
        run: |
          npm ci
          node scripts/write-build-info.mjs
          npm run build
          npx playwright install --with-deps chromium
      - name: Fixed review viewpoints (visual evidence, not traversal proof)
        timeout-minutes: 13
        working-directory: prototype
        run: node scripts/capture-floorplan.mjs
      - name: Record exact source
        if: always()
        run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Preserve fixed-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-layout-views
          path: |
            SOURCE_COMMIT.txt
            prototype/qa-results/screens/
          retention-days: 30
