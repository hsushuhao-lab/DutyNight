name: Repair workspace export
on:
  push:
    branches: [master]
    paths: ['.github/workflows/repair-workspace-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked test dependencies
        working-directory: prototype
        run: npm ci
      - name: Package tracked source and test dependencies only
        run: |
          git rev-parse HEAD > source-sha.txt
          git archive --format=tar.gz HEAD > source.tar.gz
          tar -czf dependencies.tar.gz -C prototype node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: repair-workspace
          path: |
            source-sha.txt
            source.tar.gz
            dependencies.tar.gz
          retention-days: 1
