name: Repair acceptance run
on:
  push:
    branches: [master]
    paths: ['.github/workflows/repair-workspace-export.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact audited repair patch
        id: candidate
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=' '
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='031911e8fa6bf890f6e443a3541cd87b265079032ec38879675364c50eb7ef0f','Patch checksum mismatch'
          pathlib.Path('/tmp/repair.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/repair.patch'],check=True)
          subprocess.run(['git','apply','/tmp/repair.patch'],check=True)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml .github/workflows/story-browser-playthrough.yml prototype/scripts/test-story-playthrough.mjs prototype/scripts/test-repair-acceptance.mjs prototype/src/world/shared/VerticalCore.js prototype/src/world/shared/WorldRoutes.js prototype/test_visual_geometry_contract_qa.js prototype/test_repair_geometry_qa.js
          git commit -m 'fix: validate real M4 report and finish 2F escape-door mounting'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies and build candidate
        working-directory: prototype
        env:
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          npm ci
          node scripts/write-build-info.mjs
          npm run build
          node test_repair_geometry_qa.js
          node test_playable_world_qa.js
          node test_visual_geometry_contract_qa.js
          npx playwright install --with-deps chromium
      - name: Targeted visual and interaction acceptance
        id: targeted
        continue-on-error: true
        timeout-minutes: 10
        working-directory: prototype
        env:
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: node scripts/test-repair-acceptance.mjs qa-results/repair-acceptance
      - name: Complete M1-M9 browser progression
        id: story
        continue-on-error: true
        timeout-minutes: 20
        working-directory: prototype
        env:
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
          STORY_CAPTURE: '0'
        run: node scripts/test-story-playthrough.mjs qa-results/repair-story
      - name: B2 failed-identity fail-forward
        id: b2
        continue-on-error: true
        timeout-minutes: 10
        working-directory: prototype
        env:
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: node scripts/test-b2-fail-forward.mjs qa-results/repair-b2
      - name: Publish only the fully passing candidate
        if: steps.targeted.outcome == 'success' && steps.story.outcome == 'success' && steps.b2.outcome == 'success'
        run: |
          git fetch origin master --depth=1
          test "$(git rev-parse origin/master)" = '${{ github.sha }}'
          git push origin HEAD:master
      - name: Require all acceptance results
        if: always()
        run: |
          test '${{ steps.targeted.outcome }}' = success
          test '${{ steps.story.outcome }}' = success
          test '${{ steps.b2.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-acceptance-evidence
          path: prototype/qa-results/
          retention-days: 7
