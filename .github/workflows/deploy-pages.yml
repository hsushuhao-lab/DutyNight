name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        working-directory: prototype
        run: npm ci

      - name: Hospital access and traversal QA
        working-directory: prototype
        run: |
          node test_hospital_access_policy_qa.js
          node test_acute_gate_qa.js
          node test_ward_gate_qa.js
          node test_first_campus_rooms_qa.js
          node test_first_upper_rooms_qa.js
          node test_world_traversal_qa.js
          node test_playable_world_qa.js

      - name: Build prototype
        working-directory: prototype
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
