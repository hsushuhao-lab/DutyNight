name: Deploy GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # The measured full software-rendered walkthrough takes about 18 minutes.
    # Both pre-release and public-site walkthroughs must run; do not skip either.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install locked dependencies
        working-directory: prototype
        run: npm ci
      - name: All Node regression suites
        working-directory: prototype
        run: node scripts/run-floorplan-regressions.mjs
      - name: Build and embed exact release SHA
        working-directory: prototype
        run: |
          node scripts/write-build-info.mjs
          npm run build
      - name: Install browser dependencies
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Validate production build through continuous browser walkthrough
        working-directory: prototype
        run: node scripts/test-floorplan-browser.mjs qa-results/pre-release
      - name: Capture reviewed floorplan viewpoints
        working-directory: prototype
        run: node scripts/capture-floorplan.mjs qa-results/screens
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public build fingerprint and module
        working-directory: prototype
        run: node scripts/verify-live-build.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Test the publicly deployed game
        working-directory: prototype
        run: node scripts/test-floorplan-browser.mjs qa-results/live '${{ steps.deployment.outputs.page_url }}'
      - name: Record source and release evidence
        if: always()
        run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Upload release QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            SOURCE_COMMIT.txt
            prototype/qa-results/
          retention-days: 30
